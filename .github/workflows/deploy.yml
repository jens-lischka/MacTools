name: Deploy to GitHub Pages

# Builds the add-in and publishes dist/ to GitHub Pages, so manifest.xml can
# point at a public HTTPS URL that loads on any machine (web, Mac, Windows)
# without a local dev server.

on:
  push:
    branches:
      - main
      - claude/powerpoint-cross-platform-rebuild-2SErC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Disable Jekyll so GitHub Pages serves the files verbatim.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
